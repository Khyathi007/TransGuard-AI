<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - TransGuard AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="auth-box">
        <h2 style="color: var(--accent-blue); text-align: center; margin-bottom: 20px;">TransGuard AI</h2>
        <h4 style="margin-bottom: 15px;">Create Owner Account</h4>
        {% if error %}<p style="color: var(--accent-red); margin-bottom: 10px;">{{ error }}</p>{% endif %}
        <form method="POST" action="/register">
            <label>Username</label>
            <input type="text" name="username" required>
            <label>Password</label>
            <input type="password" name="password" required>
            <label>Email</label>
            <input type="email" name="email" required>
            <label>Phone</label>
            <input type="text" name="phone" required>
            <label>Location (Village/Area)</label>
            <input type="text" name="location" required>
            <label>Assigned Transformer ID</label>
            <input type="text" name="transformer_id" placeholder="TR-001" required>
            <button type="submit" class="btn btn-green" style="width: 100%;">REGISTER</button>
        </form>
        <p style="margin-top: 15px; text-align: center;">Already registered? <a href="/login" style="color: var(--accent-blue);">Login here</a></p>
    </div>
</body>
</html>
