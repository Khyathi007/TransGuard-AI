{% extends "base.html" %}
{% block content %}
<div class="container-fluid py-4">
    <div class="row mb-4">
        <div class="col-12 d-flex justify-content-between align-items-center">
            <div>
                <h2 class="fw-bold mb-1">⚡ Cirkit Designer IoT Simulator</h2>
                <p class="text-muted mb-0">Simulate physical transformer door breaches and test ESP32 connectivity live.</p>
            </div>
            <div>
                <button class="btn btn-primary" onclick="triggerSimulatedAlertModal('YES')">
                    <i class="bi bi-bell-fill me-1"></i> Trigger Test Alarm
                </button>
            </div>
        </div>
    </div>

    <!-- Live Embedded Cirkit Designer Workspace -->
    <div class="card shadow-sm border-0 overflow-hidden" style="height: 75vh;">
        <div class="card-body p-0 h-100">
            <iframe 
                src="https://app.cirkitdesigner.com/" 
                class="w-100 h-100 border-0"
                allow="camera; microphone; clipboard-write">
            </iframe>
        </div>
    </div>
</div>
{% endblock %}
