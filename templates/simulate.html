{% extends "base.html" %}
{% block content %}
<div class="container-fluid py-4">
    <div class="row mb-4">
        <div class="col-12 d-flex justify-content-between align-items-center">
            <div>
                <h2 class="fw-bold mb-1">⚡ Cirkit Designer IoT Simulator</h2>
                <p class="text-muted mb-0">Live hardware circuit board simulation and breach trigger console.</p>
            </div>
            <div>
                <a href="{{ cirkit_url }}" target="_blank" class="btn btn-outline-primary">
                    <i class="bi bi-box-arrow-up-right me-1"></i> Open in Cirkit IDE
                </a>
            </div>
        </div>
    </div>

    <!-- Embedded Cirkit Interactive Workspace -->
    <div class="card shadow-sm border-0 overflow-hidden p-3 bg-white">
        <div style="position: relative; width: 100%; padding-top: calc(max(56.25%, 500px));">
          <iframe src="{{ cirkit_url }}?view=interactive_preview" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;" allowfullscreen></iframe>
        </div>
    </div>
</div>
{% endblock %}
